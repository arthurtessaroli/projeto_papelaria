



    <!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Papelaria</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background-color: #f5f7fa;
        color: #343a40;
      }

      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
      }

      .card-header-login {
        background: linear-gradient(135deg, #315b7d, #4f7897);
        color: #fff;
        border-radius: 12px 12px 0 0;
      }

      .btn {
        border-radius: 8px;
      }

      .btn-primary {
        background-color: #3d6f91;
        border-color: #3d6f91;
      }

      .btn-primary:hover {
        background-color: #315b7d;
        border-color: #315b7d;
      }

      .form-control {
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <main class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <!-- ERROS: a lista 'erros' vem do Python; cada erro vira um item do alerta -->
          {% if erros %}
          <div class="alert alert-danger" role="alert">
            <ul class="mb-0">
              {% for erro in erros %}
              <li>{{ erro }}</li>
              {% endfor %}
            </ul>
          </div>
          {% endif %}

          <div class="card border-info mb-3">
            <div class="card-header bg-info text-white">Dados para acesso</div>
            <div class="card-body">
              <p class="mb-1"><strong>E-mail:</strong> admin@papelaria.com</p>
              <p class="mb-0"><strong>Senha:</strong> 123456</p>
            </div>
          </div>

          <div class="card">
            <div class="card-header-login text-center py-3">
              <i class="bi bi-pencil-square fs-3 me-2"></i>
              <span class="fs-3 fw-bold">Papelaria</span>
            </div>

            <div class="card-body">
              <h2 class="text-center mb-4">Login</h2>

              <form action="{{ url_for('login') }}" method="post">
                <div class="mb-3">
                  <label for="email" class="form-label">E-mail:</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    value="{{ email | default('') }}"
                  />
                </div>

                <div class="mb-3">
                  <label for="senha" class="form-label">Senha:</label>
                  <input
                    type="password"
                    class="form-control"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
