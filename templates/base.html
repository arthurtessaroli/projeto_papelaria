<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %}Papelaria{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background-color: #f5f7fa;
        color: #343a40;
      }

      .navbar {
        background: linear-gradient(135deg, #315b7d, #4f7897);
      }

      .navbar-brand {
        font-weight: 600;
      }

      .page-header {
        margin-bottom: 25px;
      }

      .page-header h1 {
        font-weight: 600;
        color: #2f4858;
      }

      .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
      }

      .table {
        margin-bottom: 0;
      }

      .table thead th {
        background-color: #edf2f7;
        color: #40566b;
        font-weight: 600;
        white-space: nowrap;
      }

      .btn {
        border-radius: 8px;
      }

      .btn-primary {
        background-color: #3d6f91;
        border-color: #3d6f91;
      }

      .btn-primary:hover {
        background-color: #315b7d;
        border-color: #315b7d;
      }

      .form-control,
      .form-select {
        border-radius: 8px;
      }

      .badge-user {
        background-color: #dcecf7;
        color: #315b7d;
      }

      .badge-admin {
        background-color: #e5def7;
        color: #5b4585;
      }

      .low-stock {
        color: #dc3545;
        font-weight: 600;
      }

      .footer {
        margin-top: 50px;
        padding: 25px 0;
        color: #718096;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
          <i class="bi bi-pencil-square me-2"></i>
          Papelaria
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarMenu"
          aria-controls="navbarMenu"
          aria-expanded="false"
          aria-label="Alternar navegação"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('usuarios_listar') }}">
                <i class="bi bi-people me-1"></i>
                Usuários
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('produtos_listar') }}">
                <i class="bi bi-box-seam me-1"></i>
                Produtos
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('fornecedores_listar') }}">
                <i class="bi bi-truck me-1"></i>
                Fornecedores
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">{% block content %} {% endblock %}</main>

    <footer class="footer">
      <div class="container">
        <small> Sistema de Gestão - Papelaria </small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      (() => {
        "use strict";

        const forms = document.querySelectorAll(".needs-validation");

        Array.from(forms).forEach((form) => {
          form.addEventListener(
            "submit",
            (event) => {
              if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
              }

              form.classList.add("was-validated");
            },
            false,
          );
        });
      })();
    </script>
  </body>
</html>
